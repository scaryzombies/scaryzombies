# Visit https://github.com/lowlighter/metrics/blob/master/action.yml for full reference
name: Metrics
on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          retries: 5
          retries_delay: 30
          retries_output_action: 5
          retries_delay_output_action: 30

          user: scaryzombies
          template: classic
          base: header, activity
          config_order: base.header, base.activity, music, wakatime, traffic
          config_padding: 14, 18
          extras_css: |
            .items-wrapper {
              background: transparent;
              border: 1px solid #35151c;
              border-radius: 8px;
              box-sizing: border-box;
            }

            h1, h2 {
              color: #a83246 !important;
              letter-spacing: 0.3px;
            }

            .field {
              color: #d8d1c7;
            }

            .field svg {
              fill: #8f2636 !important;
            }

            .track .artist {
              color: #827980;
            }

            .track img {
              border: 1px solid #35151c;
              border-radius: 3px;
            }

            .avatar {
              border: 1px solid #8f2636;
              box-shadow: 0 0 0 2px #1a1013;
            }

            .calendar .day[fill="#ebedf0"] {
              fill: #21191d !important;
            }

            .calendar .day[fill="#9be9a8"] {
              fill: #421923 !important;
            }

            .calendar .day[fill="#40c463"] {
              fill: #68202e !important;
            }

            .calendar .day[fill="#30a14e"] {
              fill: #8f2636 !important;
            }

            .calendar .day[fill="#216e39"] {
              fill: #c13b50 !important;
            }

            :root {
              --color-calendar-graph-day-bg: #171217;
              --color-calendar-graph-day-border: #24171c;
              --color-calendar-graph-day-L1-bg: #421923;
              --color-calendar-graph-day-L2-bg: #68202e;
              --color-calendar-graph-day-L3-bg: #8f2636;
              --color-calendar-graph-day-L4-bg: #c13b50;
              --color-calendar-graph-day-L1-border: #4d1b27;
              --color-calendar-graph-day-L2-border: #742433;
              --color-calendar-graph-day-L3-border: #9c2a3c;
              --color-calendar-graph-day-L4-border: #ce4056;
            }
          plugin_lines: yes
          plugin_isocalendar: no
          plugin_traffic: yes

          plugin_music: yes
          plugin_music_provider: lastfm
          plugin_music_mode: recent
          plugin_music_token: ${{ secrets.LASTFM_TOKEN }}
          plugin_music_user: levired29

          plugin_wakatime: yes
          plugin_wakatime_days: 30
          plugin_wakatime_limit: 5
          plugin_wakatime_repositories_visibility: public
          plugin_wakatime_sections: editors, time, languages, 
          plugin_wakatime_url: https://wakatime.com
          plugin_wakatime_user: current
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
