# Visit https://github.com/lowlighter/metrics/blob/master/action.yml for full reference
name: Metrics
on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          retries: 5
          retries_delay: 30
          retries_output_action: 5
          retries_delay_output_action: 30

          user: scaryzombies
          template: classic
          base: header, activity
          config_order: base.header, base.activity, music, wakatime, traffic
          config_animations: yes
          config_padding: 14, 18
          extras_css: |
            @keyframes section-reveal {
              from {
                opacity: 0;
                transform: translateY(3px);
              }
              to {
                opacity: 1;
                transform: translateY(0);
              }
            }

            @keyframes music-pulse {
              0%, 100% {
                filter: drop-shadow(0 0 0 transparent);
                opacity: 0.78;
              }
              50% {
                filter: drop-shadow(0 0 3px #c13b50);
                opacity: 1;
              }
            }

            .items-wrapper {
              background: transparent;
              border: 1px solid #35151c;
              border-radius: 8px;
              box-sizing: border-box;
            }

            h1, h2 {
              color: #a83246 !important;
              letter-spacing: 0.3px;
              font-weight: 600;
            }

            .field {
              color: #d8d1c7;
            }

            .items-wrapper > section {
              animation: section-reveal 360ms ease-out both;
              position: relative;
            }

            .items-wrapper > section:nth-of-type(2) {
              animation-delay: 60ms;
            }

            .items-wrapper > section:nth-of-type(3) {
              animation-delay: 120ms;
            }

            .items-wrapper > section:nth-of-type(4) {
              animation-delay: 180ms;
            }

            .items-wrapper > section + section {
              margin-top: 11px;
              padding-top: 10px;
            }

            .items-wrapper > section + section::before {
              background: linear-gradient(90deg, transparent, #68202e 16%, #68202e 84%, transparent);
              content: "";
              height: 1px;
              left: 6px;
              opacity: 0.55;
              position: absolute;
              right: 6px;
              top: 0;
            }

            .field svg {
              fill: #8f2636 !important;
            }

            .items-wrapper > section:nth-of-type(2) > h2 svg {
              animation: music-pulse 2.4s ease-in-out infinite;
            }

            .track .artist {
              color: #827980;
            }

            .track img {
              border: 1px solid #35151c;
              border-radius: 3px;
              transition: border-color 160ms ease, filter 160ms ease, transform 160ms ease;
            }

            .track {
              opacity: 0.62;
              transition: opacity 160ms ease;
            }

            .track:nth-child(2) {
              opacity: 0.78;
            }

            .track:nth-child(3) {
              opacity: 0.68;
            }

            .track:first-child {
              opacity: 1;
            }

            .track:first-child img {
              border-color: #a83246;
              box-shadow: 0 0 7px rgba(168, 50, 70, 0.35);
              filter: saturate(1.08) brightness(1.04);
            }

            .track:hover {
              opacity: 1;
            }

            .track:hover img {
              border-color: #c13b50;
              filter: saturate(1.12) brightness(1.08);
              transform: scale(1.06);
            }

            .avatar {
              border: 1px solid #8f2636;
              box-shadow: 0 0 0 2px #1a1013;
            }

            .calendar .day[fill="#ebedf0"] {
              fill: #21191d !important;
            }

            .calendar .day[fill="#9be9a8"] {
              fill: #421923 !important;
            }

            .calendar .day[fill="#40c463"] {
              fill: #68202e !important;
            }

            .calendar .day[fill="#30a14e"] {
              fill: #8f2636 !important;
            }

            .calendar .day[fill="#216e39"] {
              fill: #c13b50 !important;
            }

            :root {
              --color-calendar-graph-day-bg: #171217;
              --color-calendar-graph-day-border: #24171c;
              --color-calendar-graph-day-L1-bg: #421923;
              --color-calendar-graph-day-L2-bg: #68202e;
              --color-calendar-graph-day-L3-bg: #8f2636;
              --color-calendar-graph-day-L4-bg: #c13b50;
              --color-calendar-graph-day-L1-border: #4d1b27;
              --color-calendar-graph-day-L2-border: #742433;
              --color-calendar-graph-day-L3-border: #9c2a3c;
              --color-calendar-graph-day-L4-border: #ce4056;
            }
          plugin_lines: yes
          plugin_isocalendar: no
          plugin_traffic: yes

          plugin_music: yes
          plugin_music_provider: lastfm
          plugin_music_mode: recent
          plugin_music_token: ${{ secrets.LASTFM_TOKEN }}
          plugin_music_user: levired29

          plugin_wakatime: yes
          plugin_wakatime_days: 30
          plugin_wakatime_limit: 5
          plugin_wakatime_repositories_visibility: public
          plugin_wakatime_sections: editors, time, languages, 
          plugin_wakatime_url: https://wakatime.com
          plugin_wakatime_user: current
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
